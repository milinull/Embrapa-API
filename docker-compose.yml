services:

  # Criação API FastAPI - http://localhost:8000
  web:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # DB Oracle - https://localhost:55500/em
  oracle-db:
    image: oracle/database:21.3.0-xe
    container_name: oracle-xe
    ports:
      - "51521:1521"   # Porta do banco
      - "55500:5500"   # Porta do Enterprise Manager
    environment:
      ORACLE_PWD: "123"         # senha do SYS, SYSTEM, etc.
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - oracle_data:/opt/oracle/oradata   # Persistência dos dados
    restart: unless-stopped
    shm_size: 1g  # Recomendado pelo Oracle

  # Apache NiFi - https://localhost:8443/nifi
  nifi:
    build:
      context: .
      dockerfile: Dockerfile.nifi
    container_name: nifi01
    ports:
      - "8443:8443"  # Porta HTTPS (principal)
      - "8080:8080"  # Porta HTTP (caso configure depois)
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin123admin123
    volumes:
      - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/state:/opt/nifi/nifi-current/state
      - ./nifi/logs:/opt/nifi/nifi-current/logs
    networks:
      - app-net

