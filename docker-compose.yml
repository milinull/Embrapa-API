services:

  # Criação API FastAPI - http://localhost:8000
  web:
    build: .
    container_name: fastapi_app
    ports:
      - "${FASTAPI_PORT}:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - PYTHONDONTWRITEBYTECODE=${PYTHONDONTWRITEBYTECODE}
      - ORACLE_HOST=${ORACLE_HOST}
      - ORACLE_PORT=${ORACLE_PORT}
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_SERVICE_NAME=${ORACLE_SERVICE_NAME}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - app-net

  # DB Oracle - https://localhost:55500/em
  oracle-db:
    image: oracle/database:21.3.0-xe
    container_name: oracle-xe
    ports:
      - "${ORACLE_PORT}:1521"
      - "${ORACLE_EM_PORT}:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET}
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped
    shm_size: 1g
    networks:
      - app-net

  # Apache NiFi - https://localhost:8443/nifi
  nifi:
    build:
      context: .
      dockerfile: Dockerfile.nifi
    container_name: nifi01
    ports:
      - "${NIFI_WEB_HTTPS_PORT}:8443"
      - "${NIFI_WEB_HTTP_PORT}:8080"
    environment:
      - NIFI_WEB_HTTPS_PORT=${NIFI_WEB_HTTPS_PORT}
      - NIFI_WEB_HTTPS_HOST=${NIFI_WEB_HTTPS_HOST}
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USERNAME}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
    volumes:
      - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/state:/opt/nifi/nifi-current/state
      - ./nifi/logs:/opt/nifi/nifi-current/logs
    networks:
      - app-net

